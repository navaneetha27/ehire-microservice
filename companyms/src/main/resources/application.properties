spring.application.name=companyms
spring.application.port=8080

spring.datasource.url = jdbc:postgresql://localhost:5434/company
spring.datasource.username=javauser
spring.datasource.password=javauser
spring.datasource.driver-class-name=org.postgresql.Driver

# sql statement in log
spring.jpa.show-sql=true

#ddl schema generation
spring.jpa.hibernate.ddl-auto=update


#hibernate properties to genereate sql queries

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
